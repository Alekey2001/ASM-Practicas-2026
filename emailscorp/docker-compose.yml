version: "3.9"

services:

  mysql:

    image: mysql:8.0

    container_name: aiaco_mysql

    restart: unless-stopped

    ports:
      - "3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: RootSecure2026!
      MYSQL_DATABASE: aiaco
      MYSQL_USER: aiaco_user
      MYSQL_PASSWORD: AiacoUser2026!

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: