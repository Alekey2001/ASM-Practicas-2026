
services:

  mysql:

    image: mysql:8.0

    container_name: aiaco_mysql

    restart: unless-stopped

    ports:
      - "127.0.0.1:3307:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en emailscorp/.env}
      MYSQL_DATABASE: aiaco
      MYSQL_USER: aiaco_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en emailscorp/.env}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql_data: